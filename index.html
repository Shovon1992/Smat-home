<!doctype html>
<html lang="bn">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>জ্ঞনদা ভবন</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Noto+Sans+Bengali:wght@500;700;800&display=swap"
			rel="stylesheet" />
		<style>
			:root {
				--bg-0: #14100c;
				--bg-1: #1b1611;
				--plate: #211a14;
				--plate-edge: #2c231a;
				--glass: rgba(243, 234, 217, 0.045);
				--glass-edge: rgba(243, 234, 217, 0.09);
				--brass: #ff9933;
				--brass-bright: #ffb85c;
				--cream: #f6f3ea;
				--muted: #b9b6a8;
				--muted-2: #7d7a6c;
				--on: #1da860;
				--on-glow: rgba(29, 168, 96, 0.35);
				--off: #5a6b8c;
				--line: rgba(243, 234, 217, 0.1);
				--line-soft: rgba(243, 234, 217, 0.06);
				--radius-lg: 28px;
				--radius-md: 18px;
			}
			* { box-sizing: border-box; }
			html { scroll-padding-top: env(safe-area-inset-top, 0px); }
			::selection { background: rgba(192, 138, 78, 0.35); }

			html, body {
				margin: 0;
				padding: 0;
				min-height: 100%;
				background: var(--bg-0);
				color: var(--cream);
				font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			body {
				background:
					linear-gradient(
						180deg,
						rgba(255, 153, 51, 0.4) 0%,
						rgba(255, 153, 51, 0.14) 15%,
						rgba(246, 243, 234, 0.1) 40%,
						rgba(246, 243, 234, 0.14) 60%,
						rgba(19, 136, 8, 0.13) 85%,
						rgba(19, 136, 8, 0.36) 100%
					),
					var(--bg-0);
				padding-top: env(safe-area-inset-top, 0px);
				padding-bottom: env(safe-area-inset-bottom, 0px);
			}
			h1, h2 { font-family: "Sora", "Manrope", sans-serif; }
			.bn { font-family: "Noto Sans Bengali", "Manrope", sans-serif; }
			button { font-family: inherit; }

			.screw { position: absolute; width: 8px; height: 8px; border-radius: 50%;
				background: radial-gradient(circle at 35% 30%, #45392a, #1a140f 70%);
				box-shadow: inset 0 0 0 1px rgba(243,234,217,0.08); }
			.screw::after { content: ""; position: absolute; top: 50%; left: 15%; right: 15%; height: 1px;
				background: rgba(0,0,0,0.6); transform: rotate(28deg); }

			/* ---------- Login screen ---------- */
			#loginScreen {
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
			}
			.login-card {
				width: 100%;
				max-width: 360px;
				background: linear-gradient(170deg, var(--plate), var(--bg-1));
				border: 1px solid var(--plate-edge);
				border-radius: var(--radius-lg);
				padding: 36px 30px 30px;
				box-shadow: 0 26px 60px -22px rgba(0, 0, 0, 0.8);
				text-align: center;
				position: relative;
			}
			.login-card .screw.tl { top: 14px; left: 14px; } .login-card .screw.tr { top: 14px; right: 14px; }
			.login-card .screw.bl { bottom: 14px; left: 14px; } .login-card .screw.br { bottom: 14px; right: 14px; }

			.login-icon {
				width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 50%;
				background: linear-gradient(150deg, #ffffff, var(--cream));
				display: flex; align-items: center; justify-content: center;
				box-shadow: 0 10px 26px -6px rgba(255, 153, 51, 0.45);
			}
			.login-icon svg { width: 24px; height: 24px; }
			.login-card h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -0.2px; }
			.login-card p.sub { margin: 0 0 24px; color: var(--muted-2); font-size: 13px; }
			.login-card input {
				width: 100%; background: rgba(243, 234, 217, 0.04); border: 1.5px solid var(--line);
				color: var(--cream); padding: 13px 15px; margin-bottom: 12px; font-size: 16px;
				border-radius: 12px; outline: none;
				transition: border-color 0.2s ease, background 0.2s ease;
			}
			.login-card input::placeholder { color: var(--muted-2); }
			.login-card input:focus { border-color: var(--brass); background: rgba(243, 234, 217, 0.06); }
			.login-card button {
				width: 100%; background: linear-gradient(120deg, var(--brass-bright), var(--brass));
				color: #1c1712; padding: 13px; font-size: 14.5px; font-weight: 800; border: none;
				border-radius: 12px; cursor: pointer; margin-top: 6px;
				transition: opacity 0.2s ease, transform 0.18s ease;
			}
			.login-card button:active { transform: translateY(1px); }
			.login-error { color: var(--off); font-size: 12.5px; margin-top: 12px; min-height: 16px; }

			/* ---------- Dashboard shell (mobile-first, capped width) ---------- */
			#dashboard {
				display: none;
				min-height: 100vh;
				flex-direction: column;
				max-width: 460px;
				margin: 0 auto;
			}

			.topbar {
				display: flex; align-items: center; justify-content: space-between;
				padding: 18px 20px 6px;
			}
			.brand { display: flex; align-items: center; gap: 10px; }
			.brand-icon {
				width: 32px; height: 32px; border-radius: 50%;
				background: linear-gradient(150deg, #ffffff, var(--cream));
				display: flex; align-items: center; justify-content: center; flex-shrink: 0;
			}
			.brand-icon svg { width: 16px; height: 16px; color: #1c1712; }
			.brand-name { font-size: 13.5px; font-weight: 700; font-family: "Noto Sans Bengali", sans-serif; }
			.brand-sub { font-size: 10.5px; color: var(--muted-2); margin-top: 1px; }

			.logout-btn {
				display: flex; align-items: center; justify-content: center;
				width: 34px; height: 34px; border-radius: 11px;
				background: var(--glass); border: 1px solid var(--glass-edge);
				color: var(--off); cursor: pointer;
			}
			.logout-btn svg { width: 15px; height: 15px; }

			.topbar-right { display: flex; align-items: center; gap: 12px; }
			.corner-status {
				display: flex; align-items: center; gap: 6px;
				font-size: 10.5px; font-weight: 700; color: var(--muted-2);
			}
			.corner-dot {
				width: 10px; height: 10px; border-radius: 50%;
				background: var(--off);
				box-shadow: 0 0 0 3px rgba(90, 107, 140, 0.18);
				transition: background 0.2s ease, box-shadow 0.2s ease;
			}
			.corner-dot.online {
				background: var(--on);
				box-shadow: 0 0 0 3px var(--on-glow);
				animation: pulse 2.2s ease-in-out infinite;
			}

			/* ---------- Weather / time hero ---------- */
			.hero {
				margin: 10px 18px 0;
				border-radius: var(--radius-lg);
				border: 1px solid var(--glass-edge);
				background:
					linear-gradient(155deg, rgba(192,138,78,0.14), rgba(243,234,217,0.02)),
					var(--glass);
				padding: 22px 22px 20px;
				position: relative;
				overflow: hidden;
			}
			.hero::after {
				content: "";
				position: absolute;
				width: 220px; height: 220px;
				right: -70px; top: -80px;
				background: radial-gradient(circle, rgba(238,196,138,0.18), transparent 70%);
				pointer-events: none;
			}
			.hero-top {
				display: flex; align-items: flex-start; justify-content: space-between;
				position: relative; z-index: 1;
			}
			.hero-date { font-size: 12.5px; color: var(--muted); font-weight: 600; }
			.hero-clock { font-size: 34px; font-weight: 800; font-family: "Sora", sans-serif; letter-spacing: -0.5px; margin-top: 2px; }
			.hero-loc {
				display: flex; align-items: center; gap: 5px;
				font-size: 12px; color: var(--muted-2); font-weight: 600; margin-top: 6px;
			}
			.hero-loc svg { width: 12px; height: 12px; flex-shrink: 0; }

			.hero-weather {
				display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
				position: relative; z-index: 1;
			}
			.wx-icon { width: 46px; height: 46px; color: var(--brass-bright); }
			.wx-temp { font-size: 26px; font-weight: 800; font-family: "Sora", sans-serif; }
			.wx-desc { font-size: 11.5px; color: var(--muted-2); font-weight: 600; text-align: right; }

			.hero-strip {
				display: flex; align-items: center; gap: 14px;
				margin-top: 18px; padding-top: 14px;
				border-top: 1px solid var(--line-soft);
				position: relative; z-index: 1;
			}
			.hero-strip-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
			.hero-strip-item svg { width: 13px; height: 13px; color: var(--brass); }
			.hero-note-btn {
				margin-top: 14px; width: 100%; padding: 10px; border-radius: 12px;
				background: var(--glass); border: 1px dashed var(--glass-edge);
				color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer;
				position: relative; z-index: 1;
			}

			/* ---------- Switch stage ---------- */
			.stage {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: 26px 24px 20px;
				gap: 20px;
			}

			.device-label { text-align: center; }
			.device-name {
				font-family: "Noto Sans Bengali", sans-serif;
				font-size: 21px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.2px;
			}
			.device-state {
				font-size: 13px; font-weight: 700; color: var(--muted-2);
				display: flex; align-items: center; justify-content: center; gap: 7px;
			}
			.device-state.on { color: var(--on); }
			.state-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
			.state-dot.on { box-shadow: 0 0 0 4px var(--on-glow); animation: pulse 2.2s ease-in-out infinite; }
			@keyframes pulse {
				0%, 100% { box-shadow: 0 0 0 4px var(--on-glow); }
				50% { box-shadow: 0 0 0 8px rgba(111,174,122,0.12); }
			}

			.plate {
				position: relative;
				width: 100%;
				max-width: 240px;
				background: linear-gradient(160deg, var(--plate), var(--bg-1));
				border: 1px solid var(--plate-edge);
				border-radius: 30px;
				padding: 28px 24px;
				box-shadow:
					0 30px 70px -24px rgba(0, 0, 0, 0.85),
					inset 0 1px 0 rgba(243, 234, 217, 0.04);
			}
			.plate .screw.p1 { top: 10px; left: 10px; } .plate .screw.p2 { top: 10px; right: 10px; }
			.plate .screw.p3 { bottom: 10px; left: 10px; } .plate .screw.p4 { bottom: 10px; right: 10px; }

			.rocker-well {
				width: 100%;
				height: 180px;
				border-radius: 20px;
				background: linear-gradient(180deg, #100c09, #17120d);
				box-shadow: inset 0 6px 14px rgba(0,0,0,0.65), inset 0 -2px 4px rgba(243,234,217,0.03);
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				user-select: none;
				-webkit-tap-highlight-color: transparent;
			}
			.rocker-well.disabled { cursor: not-allowed; opacity: 0.55; }
			.rocker {
				width: 142px;
				height: 142px;
				border-radius: 16px;
				background: linear-gradient(165deg, #f6efe1, #d9cbb0);
				box-shadow:
					0 14px 26px -8px rgba(0,0,0,0.6),
					inset 0 2px 0 rgba(255,255,255,0.5),
					inset 0 -6px 10px rgba(0,0,0,0.12);
				position: relative;
				transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1), background 0.3s ease, box-shadow 0.3s ease;
				transform: translateY(13px) rotateX(10deg);
			}
			.rocker::before {
				content: "";
				position: absolute;
				left: 50%; top: 20px;
				width: 42px; height: 5px;
				border-radius: 3px;
				background: rgba(28, 23, 18, 0.3);
				transform: translateX(-50%);
			}
			.rocker.on {
				background: linear-gradient(165deg, #d7ecd9, #a9d3ae);
				transform: translateY(-13px) rotateX(-10deg);
				box-shadow:
					0 18px 30px -8px rgba(111,174,122,0.35),
					inset 0 2px 0 rgba(255,255,255,0.6),
					inset 0 -6px 10px rgba(53,110,62,0.18);
			}
			.rocker.on::before { top: auto; bottom: 20px; }
			.rocker:not(.loaded) { opacity: 0.5; pointer-events: none; }
			.rocker-well:active .rocker { transform: scale(0.97) translateY(13px) rotateX(10deg); }
			.rocker-well:active .rocker.on { transform: scale(0.97) translateY(-13px) rotateX(-10deg); }

			.plate-foot {
				margin-top: 16px;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				font-size: 11px;
				color: var(--muted-2);
				font-weight: 600;
			}
			.plate-foot svg { width: 12px; height: 12px; }

			.meta-row {
				display: flex;
				align-items: center;
				gap: 18px;
				justify-content: center;
			}
			.meta-item { text-align: center; }
			.meta-item .k { font-size: 10.5px; color: var(--muted-2); font-weight: 600; margin-bottom: 3px; }
			.meta-item .v { font-size: 13px; font-weight: 700; color: var(--cream); }
			.meta-sep { width: 1px; height: 26px; background: var(--line); }

			@media (max-width: 380px) {
				.hero-clock { font-size: 28px; }
				.plate { max-width: 210px; padding: 24px 18px; }
				.rocker-well { height: 160px; }
				.rocker { width: 122px; height: 122px; }
			}
		</style>
	</head>
	<body>
		<!-- Login screen -->
		<div id="loginScreen">
			<div class="login-card">
				<span class="screw tl"></span><span class="screw tr"></span>
				<span class="screw bl"></span><span class="screw br"></span>
				<div class="login-icon">
					<svg viewBox="0 0 24 24" fill="none" stroke="#1c1712" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
						<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
					</svg>
				</div>
				<h1 class="bn">জ্ঞনদা ভবন</h1>
				<p class="sub">Sign in to control your switch</p>
				<input type="email" id="email" placeholder="Email" required autocomplete="username" />
				<input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
				<button id="loginBtn">Login</button>
				<div class="login-error" id="loginError"></div>
			</div>
		</div>

		<!-- Dashboard -->
		<div id="dashboard">
			<header class="topbar">
				<div class="brand">
					<div class="brand-icon">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
						</svg>
					</div>
					<div>
						<div class="brand-name">জ্ঞনদা ভবন</div>
						<!-- <div class="brand-sub" id="accountEmailText">--</div> -->
					</div>
				</div>
				<div class="topbar-right">
					
					<button class="logout-btn" id="logoutBtn" title="Logout">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
							<polyline points="16 17 21 12 16 7" />
							<line x1="21" y1="12" x2="9" y2="12" />
						</svg>
					</button>
				</div>
			</header>

			<!-- Weather / time hero -->
			<div class="hero">
				<div class="hero-top">
					<div>
						<div class="hero-date" id="heroDate">--</div>
						<div class="hero-clock" id="heroClock">--:--</div>
						<div class="hero-loc" id="heroLoc">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path d="M12 22s8-4.5 8-11a8 8 0 1 0-16 0c0 6.5 8 11 8 11z" /><circle cx="12" cy="11" r="2.5" />
							</svg>
							<span id="heroLocText">Locating…</span>
						</div>
					</div>
					<div class="hero-weather">
						<svg class="wx-icon" id="wxIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="12" cy="12" r="4.5" /><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
						</svg>
						<div class="wx-temp" id="wxTemp">--°</div>
						<div class="wx-desc" id="wxDesc">Fetching weather</div>
					</div>
				</div>
				<div class="hero-strip">
					<div class="hero-strip-item">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /><circle cx="12" cy="12" r="5" /></svg>
						<span id="wxHi">H --°</span>
					</div>
					<div class="hero-strip-item">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /><circle cx="12" cy="12" r="5" /></svg>
						<span id="wxLo">L --°</span>
					</div>
					<div class="hero-strip-item">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20" opacity="0"/><path d="M12 12a4 4 0 0 0-4 4M12 12a4 4 0 0 1 4 4M12 12V4" /></svg>
						<span id="wxHum">Hum --%</span>
					</div>

					<div class="hero-strip-item corner-status" id="connCorner" title="Connection status" style="    margin-left: 15% !important;">
						<span class="corner-dot" id="connCornerDot"></span>
					
					</div>
				</div>
				<button class="hero-note-btn" id="wxRetry" style="display:none">Retry</button>
			</div>

			<div class="stage">
				<div class="device-label">
					<h2 class="device-name bn" id="deviceName">বাইরের লাইট</h2>
					<div class="device-state" id="deviceState">
						<span class="state-dot"></span>
						<span id="deviceStateText">Loading…</span>
					</div>
				</div>

				<div class="plate">
					<span class="screw p1"></span><span class="screw p2"></span>
					<span class="screw p3"></span><span class="screw p4"></span>
					<div class="rocker-well" id="rockerWell">
						<div class="rocker" id="rocker"></div>
					</div>
					<div class="plate-foot">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
						</svg>
						Tap to toggle
					</div>
				</div>

				<div class="meta-row">
					<div class="meta-item">
						<div class="k">Last changed</div>
						<div class="v" id="lastChanged">--</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Firebase SDKs -->
		<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-analytics-compat.js"></script>

		<script>
			// Firebase config
			const firebaseConfig = {
				apiKey: "AIzaSyAqUPHUyW76-lhOCYGB3G5tp7ZsP0wHuGY",
				authDomain: "my-home-3608f.firebaseapp.com",
				databaseURL: "https://my-home-3608f-default-rtdb.firebaseio.com",
				projectId: "my-home-3608f",
				storageBucket: "my-home-3608f.firebasestorage.app",
				messagingSenderId: "515231206997",
				appId: "1:515231206997:web:dbeacbc0d8a781d1f50edc",
				measurementId: "G-X549PN8311",

			firebase.initializeApp(firebaseConfig);
			firebase.analytics();

			// Login credentials
			const allowedEmail = "shov.mondal92@gmail.com";
			const allowedPassword = "Shovon@1992";

			// The single switch this dashboard controls — change path/name here
			const SWITCH_PATH = "Switch1";
			const SWITCH_NAME = "বাইরের হ্যালোজেন লাইট";

			const loginScreen = document.getElementById("loginScreen");
			const dashboard = document.getElementById("dashboard");
			const loginBtn = document.getElementById("loginBtn");
			const loginError = document.getElementById("loginError");

			const rocker = document.getElementById("rocker");
			const rockerWell = document.getElementById("rockerWell");
			const deviceState = document.getElementById("deviceState");
			const deviceStateText = document.getElementById("deviceStateText");
			const lastChanged = document.getElementById("lastChanged");
			const accountEmailText = document.getElementById("accountEmailText");
			const connCornerDot = document.getElementById("connCornerDot");

			document.getElementById("deviceName").textContent = SWITCH_NAME;

			let state = { on: false, loaded: false };
			let connected = false;

			function nowLabel() {
				const d = new Date();
				let h = d.getHours();
				const m = d.getMinutes().toString().padStart(2, "0");
				const ampm = h >= 12 ? "PM" : "AM";
				h = h % 12;
				if (h === 0) h = 12;
				return `${h.toString().padStart(2, "0")}:${m} ${ampm}`;
			}

			function updateClock() {
				const d = new Date();
				document.getElementById("heroClock").textContent = nowLabel();
				document.getElementById("heroDate").textContent = d.toLocaleDateString(undefined, {
					weekday: "short",
					day: "2-digit",
					month: "short",
				});
			}

			function renderSwitch() {
				const showOn = connected && state.on;
				rocker.classList.toggle("on", showOn);
				rocker.classList.toggle("loaded", state.loaded);
				deviceState.classList.toggle("on", showOn);
				rockerWell.classList.toggle("disabled", !connected);
				if (!connected) {
					deviceStateText.textContent = "Offline";
				} else {
					deviceStateText.textContent = state.loaded ? (state.on ? "ON" : "OFF") : "Loading…";
				}
			}

			function setConnStatus(online) {
				connected = online;
				connCornerDot.classList.toggle("online", online);
				renderSwitch();
			}

			let dbRefAttached = false;

			function startSwitchControl(user) {
				accountEmailText.textContent = user && user.email ? user.email : allowedEmail;

				const db = firebase.database();
				setConnStatus(false);

				db.ref(".info/connected").on("value", (snap) => {
					setConnStatus(!!snap.val());
				});

				if (dbRefAttached) return;
				dbRefAttached = true;

				const swRef = db.ref("/" + SWITCH_PATH);
				swRef.on("value", (snapshot) => {
					const newOn = !!snapshot.val();
					const changed = state.loaded && state.on !== newOn;
					state.on = newOn;
					state.loaded = true;
					if (changed) lastChanged.textContent = nowLabel();
					renderSwitch();
				});

				rockerWell.addEventListener("click", () => {
					if (!state.loaded || !connected) return;
					db.ref("/" + SWITCH_PATH).set(!state.on);
				});

				renderSwitch();
			}

			function doLogin() {
				const email = document.getElementById("email").value.trim();
				const password = document.getElementById("password").value;
				loginError.textContent = "";

				if (!email || !password) {
					loginError.textContent = "Please enter email and password.";
					return;
				}

				if (email === allowedEmail && password === allowedPassword) {
					firebase
						.auth()
						.signInWithEmailAndPassword(email, password)
						.then((userCredential) => {
							loginScreen.style.display = "none";
							dashboard.style.display = "flex";
							startSwitchControl(userCredential.user);
							initWeather();
						})
						.catch((error) => {
							loginError.textContent = "Firebase login failed: " + error.message;
						});
				} else {
					loginError.textContent = "Invalid email or password.";
				}
			}

			loginBtn.addEventListener("click", doLogin);
			document.getElementById("password").addEventListener("keydown", (e) => {
				if (e.key === "Enter") doLogin();
			});

			document.getElementById("logoutBtn").addEventListener("click", () => {
				firebase
					.auth()
					.signOut()
					.then(() => {
						dashboard.style.display = "none";
						loginScreen.style.display = "flex";
						document.getElementById("email").value = "";
						document.getElementById("password").value = "";
						loginError.textContent = "";
					})
					.catch((error) => {
						loginError.textContent = "Logout failed: " + error.message;
					});
			});

			updateClock();
			setInterval(updateClock, 1000 * 15);

			/* ---------------- Weather + location ---------------- */
			const WX_ICONS = {
				sun: '<circle cx="12" cy="12" r="4.5" /><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />',
				cloudSun: '<path d="M6.5 9a5 5 0 0 1 9.6-1.9" /><path d="M4 16a3.5 3.5 0 0 1 .8-6.9 5 5 0 0 1 9.6 1.4A4 4 0 0 1 14 18H6a3 3 0 0 1-2-2z" /><path d="M17 4v1.4M20.6 7.4h-1.4" />',
				cloud: '<path d="M6.5 19a4.5 4.5 0 0 1-.9-8.9 6 6 0 0 1 11.6-1.6A5 5 0 0 1 17 19H6.5z" />',
				rain: '<path d="M6.5 15a4.5 4.5 0 0 1-.9-8.9 6 6 0 0 1 11.6-1.6A5 5 0 0 1 17 15H6.5z" /><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2" />',
				snow: '<path d="M6.5 13a4.5 4.5 0 0 1-.9-8.4 6 6 0 0 1 11.6-1.1A5 5 0 0 1 17 13H6.5z" /><path d="M8 18v3M8 18.2l-2 1M8 18.2l2 1M12 18v3M12 18.2l-2 1M12 18.2l2 1M16 18v3M16 18.2l-2 1M16 18.2l2 1" />',
				storm: '<path d="M6.5 13a4.5 4.5 0 0 1-.9-8.4 6 6 0 0 1 11.6-1.1A5 5 0 0 1 17 13H6.5z" /><path d="M12 15l-2 4h3l-2 4" />',
				fog: '<path d="M6.5 11a4.5 4.5 0 0 1 8.9-1.4M17 11a3.5 3.5 0 0 1 .3 7H6" /><path d="M4 19h16M6 22h12" />',
			};
			function wxIconFor(code) {
				if (code === 0) return WX_ICONS.sun;
				if ([1, 2].includes(code)) return WX_ICONS.cloudSun;
				if (code === 3) return WX_ICONS.cloud;
				if ([45, 48].includes(code)) return WX_ICONS.fog;
				if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return WX_ICONS.rain;
				if ([71, 73, 75, 77, 85, 86].includes(code)) return WX_ICONS.snow;
				if ([95, 96, 99].includes(code)) return WX_ICONS.storm;
				return WX_ICONS.cloud;
			}
			function wxLabelFor(code) {
				const map = {
					0: "Clear sky", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
					45: "Foggy", 48: "Foggy",
					51: "Light drizzle", 53: "Drizzle", 55: "Dense drizzle",
					56: "Freezing drizzle", 57: "Freezing drizzle",
					61: "Light rain", 63: "Rain", 65: "Heavy rain",
					66: "Freezing rain", 67: "Freezing rain",
					71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
					80: "Rain showers", 81: "Rain showers", 82: "Violent showers",
					85: "Snow showers", 86: "Snow showers",
					95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm",
				};
				return map[code] || "—";
			}

			async function fetchWeather(lat, lon) {
				const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
				const res = await fetch(url);
				if (!res.ok) throw new Error("weather fetch failed");
				return res.json();
			}

			async function fetchPlaceName(lat, lon) {
				try {
					const res = await fetch(
						`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`
					);
					if (!res.ok) throw new Error("reverse geocode failed");
					const data = await res.json();
					return data.city || data.locality || data.principalSubdivision || "Your location";
				} catch (e) {
					return "Your location";
				}
			}

			// Fixed location this dashboard reports weather for
			const WX_LAT = 23.667403;
			const WX_LON = 87.359295;

			async function initWeather() {
				const retryBtn = document.getElementById("wxRetry");
				const locText = document.getElementById("heroLocText");
				retryBtn.style.display = "none";

				try {
					const [place, weather] = await Promise.all([
						fetchPlaceName(WX_LAT, WX_LON),
						fetchWeather(WX_LAT, WX_LON),
					]);
					locText.textContent = place;
					const cur = weather.current;
					const daily = weather.daily;
					document.getElementById("wxTemp").textContent = Math.round(cur.temperature_2m) + "°";
					document.getElementById("wxDesc").textContent = wxLabelFor(cur.weather_code);
					document.getElementById("wxIcon").innerHTML = wxIconFor(cur.weather_code);
					document.getElementById("wxHum").textContent = "Hum " + Math.round(cur.relative_humidity_2m) + "%";
					if (daily && daily.temperature_2m_max && daily.temperature_2m_max[0] != null) {
						document.getElementById("wxHi").textContent = "H " + Math.round(daily.temperature_2m_max[0]) + "°";
						document.getElementById("wxLo").textContent = "L " + Math.round(daily.temperature_2m_min[0]) + "°";
					}
				} catch (e) {
					document.getElementById("wxDesc").textContent = "Weather unavailable";
					retryBtn.textContent = "Retry";
					retryBtn.style.display = "block";
				}
			}
			document.getElementById("wxRetry").addEventListener("click", initWeather);
		</script>
	</body>
</html>
